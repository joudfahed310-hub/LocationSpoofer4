name: Release on Version Update

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Check and Resolve Version
        id: check_version
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | awk -F"'" '{print $2}')
          fi
          
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="manual"
          fi
          
          TAG_NAME="v$VERSION_NAME"
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME"; then
              TAG_NAME="v$VERSION_NAME-${{ github.run_number }}"
            fi
          else
            if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME"; then
              echo "changed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Strip Signing Configuration
        if: steps.check_version.outputs.changed == 'true'
        run: |
          sed -i '/signingConfigs {/,/^    }/d' app/build.gradle.kts || true
          sed -i '/signingConfig = signingConfigs./d' app/build.gradle.kts || true
          
      - name: Build Debug APK
        if: steps.check_version.outputs.changed == 'true'
        env:
          # 🟢 الحل هنا: تمرير مفتاح وهمي بصيغة صحيحة لكي لا يجد التطبيق القيمة فارغة وينهار
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || 'AIzaSyDummyKeyForBypassingCrash123456789' }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

          APK_DIR="app/build/outputs/apk/debug"
          mkdir -p app/build/outputs/apk/release_output
          
          find $APK_DIR -name "*.apk" -print0 | while IFS= read -r -d '' file; do
            mv "$file" "app/build/outputs/apk/release_output/LocationSpoofer-${{ steps.check_version.outputs.tag }}.apk"
          done

      - name: Publish GitHub Release
        if: steps.check_version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.tag }}
          name: LocationSpoofer ${{ steps.check_version.outputs.tag }}
          body: "تلقائي: تم بناء التطبيق مع تمرير مفتاح خرائط لتفادي الانهيار عند الفتح."
          files: app/build/outputs/apk/release_output/LocationSpoofer-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
